<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng – Kem Tràng Tiền</title>
    <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="cart">
    <div id="site-header"></div>
    <div class="container">
        <h1 class="sec-title">GIỎ HÀNG CỦA BẠN</h1>
        <div class="cart-wrap">
            <table class="cart-table" id="cartTable">
                <thead><tr><th>STT</th><th>Sản phẩm</th><th>Hình</th><th>Đơn giá</th><th>Số lượng</th><th>Thành tiền</th><th>Thao tác</th></tr></thead>
                <tbody id="addCart"></tbody>
            </table>
        </div>
        <div class="cart-total">
            <p>Tổng thành tiền: <strong id="tongthanhtien">0đ</strong></p>
            <button type="button" class="sc-btn" id="btnPay" onclick="thanhToan()">THANH TOÁN</button>
        </div>
        <h1 class="sec-title">THÊM SẢN PHẨM VÀO GIỎ</h1>
        <div class="row" id="productAll"></div>
    </div>
    <div id="site-footer"></div>
    <script src="js/product.js"></script>
    <script src="js/common.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
