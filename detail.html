<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm – Kem Tràng Tiền</title>
    <link rel="stylesheet" href="css/detail.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="detail">
    <div id="site-header"></div>
    <div class="container">
        <div class="breadcrumb"><a href="index.html">Trang chủ</a> › <a id="bcLoai" href="category.html">Sản phẩm</a> › <span id="bcTen"></span></div>
        <div id="chitiet" class="pd">
            <div class="left"><img id="hinh" src="images/sanpham1.png" alt=""></div>
            <div class="right">
                <h1 id="tenSP"></h1>
                <p class="pd-cat">Danh mục: <a id="loaiSP" href="category.html"></a></p>
                <p class="pd-price" id="giaSP"></p>
                <p class="pd-desc" id="moTaSP"></p>
                <div class="pd-qty"><span>Số lượng</span>
                    <div class="qty"><button type="button" onclick="doiSoLuong(-1)">−</button>
                        <input type="number" id="soLuong" value="1" min="1" max="99" onchange="doiSoLuong(0)">
                        <button type="button" onclick="doiSoLuong(1)">+</button></div></div>
                <button type="button" class="sc-btn" id="btnAddCart" onclick="themVaoGio()">THÊM VÀO GIỎ HÀNG</button>
                <p id="addMsg" class="pd-msg" role="status"></p>
            </div>
        </div>
        <div id="sptt-wrap">
            <h1 class="sec-title">SẢN PHẨM TƯƠNG TỰ</h1>
            <div class="row" id="sptt"></div>
        </div>
    </div>
    <div id="site-footer"></div>
    <script src="js/product.js"></script>
    <script>let trang = "detail";</script>
    <script src="js/common.js"></script>
